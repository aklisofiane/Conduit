name: test

# CI runs the cheap, reliable layers only: typecheck (incl. test/), lint,
# and unit tests. Integration / API contract / E2E / Playwright are run
# locally against the docker test stack — see docs/VALIDATION.md.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
