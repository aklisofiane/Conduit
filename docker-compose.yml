services:
  postgres:
    image: postgres:18-alpine
    container_name: conduit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
      # Postgres 18 manages major-version subdirs under the mount itself, so
      # mount the named volume at /var/lib/postgresql and point PGDATA at a subdir.
      PGDATA: /var/lib/postgresql/data/pg
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - conduit_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U conduit -d conduit']
      interval: 5s
      timeout: 5s
      retries: 10

  temporal-postgres:
    image: postgres:18-alpine
    container_name: conduit-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
      PGDATA: /var/lib/postgresql/data/pg
    volumes:
      - temporal_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal -d temporal']
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: conduit-temporal
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DEFAULT_NAMESPACE=default
      - DEFAULT_NAMESPACE_RETENTION=72h
    ports:
      - '${TEMPORAL_PORT:-7233}:7233'

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: conduit-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:${WEB_PORT:-5173},http://localhost:${API_PORT:-3000}
    ports:
      - '${TEMPORAL_UI_PORT:-8080}:8080'

  redis:
    image: redis:8-alpine
    container_name: conduit-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - conduit_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  conduit_pg_data:
  temporal_pg_data:
  conduit_redis_data:
