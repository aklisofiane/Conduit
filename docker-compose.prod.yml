# Production stack for Coolify deployment.
# All secrets/config are ${VAR} placeholders — set them in Coolify's UI.
#
# Build from repo root:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# ---- Origin configuration ----
# The whole stack is served from ONE public origin (see the api service's
# routing note). Four values must agree exactly, scheme included — if TLS is
# terminated in front of this stack, every one of them is `https://`:
#
#   WEB_DOMAIN           app.example.com        (host only, no scheme)
#   BETTER_AUTH_URL      https://app.example.com
#   VITE_API_URL         https://app.example.com   (build arg — baked into the bundle)
#   CONDUIT_CORS_ORIGIN  https://app.example.com
#
# OAuth callbacks registered with GitHub/GitLab are then
# `${BETTER_AUTH_URL}/api/auth/callback/{github,gitlab}`. A mismatch in any of
# the four surfaces as the provider rejecting the redirect URI.
#
# There is no API_DOMAIN any more — a second domain was the source of both
# cross-site cookie breakage and redirect_uri drift.

services:
  # ---------- Infrastructure ----------

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conduit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-conduit}
      PGDATA: /var/lib/postgresql/data/pg
    volumes:
      - conduit_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-conduit} -d ${POSTGRES_DB:-conduit}']
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: temporal
      PGDATA: /var/lib/postgresql/data/pg
    volumes:
      - temporal_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal -d temporal']
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      - POSTGRES_SEEDS=temporal-postgres
    healthcheck:
      test: ['CMD', 'tctl', '--address', 'temporal:7233', 'cluster', 'health']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    # Not exposed — access via SSH tunnel: ssh -L 8080:localhost:8080 your-vps

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - conduit_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------- Agent runner (build-only) ----------
  # The worker spawns agent-runner containers at runtime via the Docker socket.
  # This service only exists so `docker compose build` produces the image on the
  # host — it never runs as a long-lived service.
  agent-runner:
    build:
      context: .
      dockerfile: apps/agent-runner/Dockerfile
    image: conduit-agent-runner:latest
    entrypoint: ['true']
    restart: 'no'

  # ---------- Application ----------

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Single-origin routing: the API is path-routed under the SAME host as the
    # web app rather than living on its own domain. This is what makes the
    # Better Auth session cookie first-party — it defaults to host-only
    # `SameSite=Lax`, which a browser drops on cross-site XHR (a split
    # api./app. pair only works while both share a registrable domain, and
    # not at all against a Coolify-generated host). One origin also means
    # `BETTER_AUTH_URL` cannot disagree with the origin the browser hits,
    # which is what the OAuth `redirect_uri` is derived from.
    #
    # `/socket.io` is listed explicitly: Nest's global prefix covers `/api`,
    # but the socket.io adapter serves outside it.
    #
    # Priority beats the web router's catch-all `Host()` rule below — Traefik
    # would already rank this rule higher on length, but ordering this
    # important should not rest on that.
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${WEB_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))
      - traefik.http.routers.api.priority=100
      - traefik.http.routers.api.entrypoints=http
      - traefik.http.services.api.loadbalancer.server.port=3000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-conduit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-conduit}?schema=public
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-conduit-workflows}
      REDIS_URL: redis://redis:6379
      API_PORT: '3000'
      CONDUIT_CORS_ORIGIN: ${CONDUIT_CORS_ORIGIN}
      CONDUIT_DEPLOYMENT: hosted
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      CONDUIT_ENCRYPTION_KEY: ${CONDUIT_ENCRYPTION_KEY}
      CONDUIT_SEED_EMAILS: ${CONDUIT_SEED_EMAILS:-}
      WEBHOOK_DEV_SECRET: ''
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-conduit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-conduit}?schema=public
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-conduit-workflows}
      REDIS_URL: redis://redis:6379
      # Must match the api service — selects docker runner mode. Without it the
      # worker defaults to host mode and crashes at boot. See runner/mode.ts.
      CONDUIT_DEPLOYMENT: hosted
      CONDUIT_PROVIDER: ${CONDUIT_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CONDUIT_AGENT_AUTH: ${CONDUIT_AGENT_AUTH:-api-key}
      CONDUIT_ENCRYPTION_KEY: ${CONDUIT_ENCRYPTION_KEY}
      CONDUIT_HOME: /var/lib/conduit
      CONDUIT_RUNNER_IMAGE: conduit-agent-runner:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind mount (NOT a named volume). The worker spawns agent-runner
      # containers via the host Docker socket with same-path bind mounts
      # (-v /var/lib/conduit/runs/<id>:/var/lib/conduit/runs/<id>). The
      # Docker daemon resolves those against the HOST filesystem, so the
      # worker's CONDUIT_HOME must be a real host directory — a named
      # volume would live under /var/lib/docker/volumes/ and the paths
      # would not match.
      - /var/lib/conduit:/var/lib/conduit
      # Codex OAuth: the worker stats ~/.codex/auth.json to decide whether
      # to bind-mount it into agent-runner containers. Same host-path rule
      # as CONDUIT_HOME — the path must match the host so the Docker
      # daemon finds the file when the agent-runner mount is created.
      - ${CODEX_AUTH_DIR:-/root/.codex}:/root/.codex:ro
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Catch-all for the same host: everything the api router above did not
    # claim falls through to the SPA. Explicit low priority — see the note there.
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.web.priority=1
      - traefik.http.routers.web.entrypoints=http
      - traefik.http.services.web.loadbalancer.server.port=80
    expose:
      - '80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  conduit_pg_data:
  temporal_pg_data:
  conduit_redis_data:
